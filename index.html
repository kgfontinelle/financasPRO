<!DOCTYPE html>
<html lang="pt-br" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pro - KleDer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- FIREBASE (Compat) - Adicionado módulo de Autenticação -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        #expenseList::-webkit-scrollbar { width: 6px; }
        #expenseList::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl max-w-md w-full text-center border border-slate-200 dark:border-slate-700">
            <h1 class="text-4xl font-bold text-slate-800 dark:text-white mb-2">💰 Finanças Pro</h1>
            <p class="text-slate-500 dark:text-slate-400 mb-8">Faça login para acessar seu painel individual e privado.</p>
            
            <button onclick="loginComGoogle()" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 text-slate-700 dark:text-white font-bold py-3 px-4 rounded-xl transition shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-6 h-6">
                Entrar com o Google
            </button>
        </div>
    </div>

    <!-- APLICATIVO PRINCIPAL (Oculto até fazer login) -->
    <div id="mainApp" class="max-w-6xl mx-auto p-4 md:p-8 hidden">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 dark:text-white">💰 Finanças Pro</h1>
                <p id="userNameDisplay" class="text-emerald-600 dark:text-emerald-400 font-semibold text-sm">Olá, Usuário</p>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold uppercase text-slate-400 mb-1 ml-1">Mês</label>
                    <input type="month" id="monthSelector" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 text-sm outline-none">
                </div>

                <button onclick="toggleDarkMode()" class="mt-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2.5 rounded-xl shadow-sm transition">
                    <i id="themeIcon" class="fas fa-moon text-slate-600 dark:text-yellow-400"></i>
                </button>

                <button onclick="exportToCSV()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fas fa-file-export"></i> <span class="hidden sm:inline">CSV</span>
                </button>

                <!-- Botão de Sair -->
                <button onclick="logout()" class="mt-4 bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-200 dark:hover:bg-rose-900/50 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </header>

        <!-- Conteúdo Principal -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="space-y-6">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Salário do Mês (R$)</label>
                    <input type="text" inputmode="decimal" id="salaryInput" placeholder="0,00" class="w-full text-2xl font-bold bg-transparent border-b-2 border-slate-100 dark:border-slate-700 focus:border-blue-500 outline-none transition-all pb-2 disabled:opacity-50">
                </div>

                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <h2 class="text-lg font-bold mb-4">Nova Despesa</h2>
                    <div class="space-y-4">
                        <input type="text" id="descInput" placeholder="Descrição (ex: Aluguel)" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        
                        <div class="flex gap-4">
                            <input type="number" id="valueInput" placeholder="Valor Total (R$)" class="w-2/3 p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="number" id="installmentsInput" placeholder="Parcelas" min="1" value="1" title="Número de parcelas" class="w-1/3 p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <input type="text" id="obsInput" placeholder="Observação (opcional)" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        
                        <select id="typeInput" onchange="toggleCardName()" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="geral">Despesa Geral</option>
                            <option value="cartao">Cartão de Crédito</option>
                        </select>
                        <div id="cardNameContainer" class="hidden">
                            <input type="text" id="cardNameInput" placeholder="Nome do Cartão (ex: Amex)" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-purple-500">
                        </div>
                        <button onclick="addExpense()" id="addBtn" class="w-full bg-slate-800 dark:bg-blue-600 hover:bg-black dark:hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg disabled:opacity-50">Adicionar Despesa</button>
                    </div>
                </div>
                <button onclick="clearMonth()" class="w-full text-rose-500 text-sm font-semibold hover:bg-rose-50 dark:hover:bg-rose-900/20 py-2 rounded-lg transition"><i class="fas fa-trash-alt mr-1"></i> Limpar este mês</button>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border-b-4 border-emerald-500"><p class="text-xs font-bold text-slate-400 uppercase">Receita</p><p id="displaySalary" class="text-xl font-bold text-emerald-600">Carregando...</p></div>
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border-b-4 border-rose-500"><p class="text-xs font-bold text-slate-400 uppercase">Despesas</p><p id="displayExpenses" class="text-xl font-bold text-rose-600">...</p></div>
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border-b-4 border-blue-500"><p class="text-xs font-bold text-slate-400 uppercase">Sobra</p><p id="displayBalance" class="text-xl font-bold text-blue-600">...</p></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700"><h3 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Gastos por Tipo</h3><div class="relative h-64"><canvas id="expenseChart"></canvas></div></div>
                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col overflow-hidden">
                        <div class="p-4 border-b dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50 flex justify-between items-center"><h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Histórico do Mês</h3><span id="expenseCount" class="bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-1 rounded text-[10px] font-bold">0 itens</span></div>
                        <ul id="expenseList" class="divide-y divide-slate-100 dark:divide-slate-700 overflow-y-auto max-h-64"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-12 pb-8 text-center border-t dark:border-slate-800 pt-8">
            <div class="text-xs text-slate-400 dark:text-slate-500 space-y-1">
                <p>Versão 3.0 Nuvem Multi-Usuários</p>
                <p>By <span class="font-bold text-slate-600 dark:text-slate-300">KleDer</span> | <a href="mailto:kgfontinelle@gmail.com" class="hover:text-blue-500 transition">kgfontinelle@gmail.com</a></p>
            </div>
        </footer>
    </div>

<script>
    // 1. CONFIGURAÇÃO DO FIREBASE (Suas Chaves Mantidas)
    const firebaseConfig = {
        apiKey: "AIzaSyDSVUcl_2AubS8oHEH5P_NTSCawQEkFeIE",
        authDomain: "financaspro-79f1d.firebaseapp.com",
        projectId: "financaspro-79f1d",
        storageBucket: "financaspro-79f1d.firebasestorage.app",
        messagingSenderId: "50533258484",
        appId: "1:50533258484:web:432f9ecacda57e26337aa1"
    };

    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let docRef = null;

    let state = { theme: 'light', monthsData: {} };
    let myChart = null;
    let currentMonthKey = "";
    let isDataLoaded = false;

    const monthSelector = document.getElementById('monthSelector');
    const salaryInput = document.getElementById('salaryInput');
    const descInput = document.getElementById('descInput');
    const valueInput = document.getElementById('valueInput');
    const installmentsInput = document.getElementById('installmentsInput');
    const obsInput = document.getElementById('obsInput');
    const typeInput = document.getElementById('typeInput');
    const cardNameInput = document.getElementById('cardNameInput');
    const cardNameContainer = document.getElementById('cardNameContainer');
    const expenseList = document.getElementById('expenseList');

    // MONITOR DE LOGIN: Verifica se tem alguém logado
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            // Se estiver logado, mostra o App e esconde o Login
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            
            // Pega o primeiro nome do usuário
            const firstName = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';
            document.getElementById('userNameDisplay').innerText = `Olá, ${firstName}`;

            // Configura o banco de dados para salvar na gaveta EXCLUSIVA desse usuário (user.uid)
            docRef = db.collection("financas").doc(user.uid);
            
            document.getElementById('salaryInput').disabled = true;
            document.getElementById('addBtn').disabled = true;
            
            await loadFromFirebase();
            
            document.getElementById('salaryInput').disabled = false;
            document.getElementById('addBtn').disabled = false;
            isDataLoaded = true;

            initMonthSelector();
            applyTheme();
            updateUI();
        } else {
            // Se NÃO estiver logado, mostra a tela de login
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
            isDataLoaded = false;
        }
    });

    // Função de Login com Google
    function loginComGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch((error) => {
            console.error("Erro no login:", error);
            alert("Erro ao tentar fazer login. Verifique se ativou o método Google no Firebase.");
        });
    }

    // Função de Sair da Conta
    function logout() {
        auth.signOut();
        // Reseta o estado local ao sair
        state = { theme: 'light', monthsData: {} };
        if (myChart) myChart.destroy();
    }

    async function loadFromFirebase() {
        try {
            const docSnap = await docRef.get();
            if (docSnap.exists) {
                state = docSnap.data();
                if(!state.monthsData) state.monthsData = {};
            } else {
                // Se é o primeiro acesso da pessoa, cria o estado vazio
                state = { theme: 'light', monthsData: {} };
            }
        } catch (e) {
            console.error("Erro ao ler dados da nuvem:", e);
        }
    }

    let saveTimeout;
    function save() {
        if(!db || !isDataLoaded || !docRef) return;
        clearTimeout(saveTimeout);
        
        saveTimeout = setTimeout(async () => {
            try {
                await docRef.set(state);
            } catch (e) {
                console.error("Erro ao salvar:", e);
            }
        }, 1000); 
    }

    function initMonthSelector() {
        const now = new Date();
        currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        monthSelector.value = currentMonthKey;
        if (!state.monthsData[currentMonthKey]) state.monthsData[currentMonthKey] = { salary: 0, expenses: [] };

        monthSelector.addEventListener('change', (e) => {
            currentMonthKey = e.target.value;
            if (!state.monthsData[currentMonthKey]) state.monthsData[currentMonthKey] = { salary: 0, expenses: [] };
            updateUI();
        });
    }

    function toggleCardName() { cardNameContainer.classList.toggle('hidden', typeInput.value !== 'cartao'); }

    function toggleDarkMode() {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        applyTheme();
        save();
    }

    function applyTheme() {
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        const icon = document.getElementById('themeIcon');
        if (state.theme === 'dark') {
            icon.className = "fas fa-sun text-yellow-400";
        } else {
            icon.className = "fas fa-moon text-slate-600";
        }
    }

    salaryInput.addEventListener('input', (e) => {
        if(!isDataLoaded) return;
        let valStr = e.target.value.replace(/\./g, '').replace(',', '.');
        state.monthsData[currentMonthKey].salary = parseFloat(valStr) || 0;
        updateUI(false); 
    });

    monthSelector.addEventListener('change', () => {
        let sal = state.monthsData[currentMonthKey].salary || '';
        salaryInput.value = sal ? sal.toString().replace('.', ',') : '';
    });

    function addMonthsToKey(key, monthsToAdd) {
        let [year, month] = key.split('-').map(Number);
        month += monthsToAdd;
        while (month > 12) {
            month -= 12;
            year += 1;
        }
        return `${year}-${String(month).padStart(2, '0')}`;
    }

    function addExpense() {
        const desc = descInput.value.trim();
        const totalVal = parseFloat(valueInput.value);
        const installments = parseInt(installmentsInput.value) || 1;
        const obs = obsInput.value.trim(); 
        const type = typeInput.value;
        const cardName = type === 'cartao' ? cardNameInput.value.trim() : '';

        if (!desc || isNaN(totalVal) || totalVal <= 0) return alert("Preencha corretamente!");
        if (installments < 1) return alert("O número de parcelas deve ser pelo menos 1!");
        if (type === 'cartao' && !cardName) return alert("Informe o nome do cartão!");

        const installmentValue = totalVal / installments;

        for (let i = 0; i < installments; i++) {
            const targetMonthKey = addMonthsToKey(currentMonthKey, i);
            
            if (!state.monthsData[targetMonthKey]) {
                state.monthsData[targetMonthKey] = { salary: 0, expenses: [] };
            }

            const installmentDesc = installments > 1 ? `${desc} (${i + 1}/${installments})` : desc;

            state.monthsData[targetMonthKey].expenses.push({
                id: Date.now() + i, 
                description: installmentDesc,
                value: installmentValue,
                observation: obs,
                type: type,
                cardName: cardName || 'Cartão'
            });
        }

        descInput.value = ''; 
        valueInput.value = ''; 
        installmentsInput.value = '1';
        obsInput.value = ''; 
        cardNameInput.value = '';
        
        updateUI();
    }

    function removeExpense(id) {
        state.monthsData[currentMonthKey].expenses = state.monthsData[currentMonthKey].expenses.filter(e => e.id !== id);
        updateUI();
    }

    function clearMonth() {
        if (confirm("Limpar este mês?")) {
            state.monthsData[currentMonthKey] = { salary: 0, expenses: [] };
            salaryInput.value = '';
            updateUI();
        }
    }

    function updateUI(updateSalaryField = true) {
        if(!isDataLoaded) return;
        const data = state.monthsData[currentMonthKey];
        
        if (updateSalaryField) {
            let sal = data.salary || '';
            salaryInput.value = sal ? sal.toString().replace('.', ',') : '';
        }
        
        const totalExp = data.expenses.reduce((acc, curr) => acc + curr.value, 0);
        const balance = (data.salary || 0) - totalExp;

        document.getElementById('displaySalary').innerText = formatCurrency(data.salary || 0);
        document.getElementById('displayExpenses').innerText = formatCurrency(totalExp);
        document.getElementById('displayBalance').innerText = formatCurrency(balance);
        document.getElementById('displayBalance').className = balance < 0 ? "text-xl font-bold text-rose-600" : "text-xl font-bold text-blue-600";

        renderList(data.expenses);
        renderChart(data.expenses);
        save();
    }

    function renderList(expenses) {
        document.getElementById('expenseCount').innerText = `${expenses.length} itens`;
        if (expenses.length === 0) {
            expenseList.innerHTML = `<li class="p-8 text-center text-slate-400 italic text-sm">Sem despesas este mês.</li>`;
            return;
        }
        expenseList.innerHTML = expenses.map(exp => `
            <li class="p-4 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-700/30 transition group">
                <div class="flex items-center gap-3">
                    <div class="${exp.type === 'cartao' ? 'text-purple-500' : 'text-orange-500'}"><i class="fas ${exp.type === 'cartao' ? 'fa-credit-card' : 'fa-shopping-basket'}"></i></div>
                    <div>
                        <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">${exp.description}</p>
                        <p class="text-[10px] uppercase text-slate-400 font-bold">
                            ${exp.type === 'cartao' ? exp.cardName : 'Geral'}
                            ${exp.observation ? ` • ${exp.observation}` : ''}
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm font-bold text-rose-500">-${formatCurrency(exp.value)}</span>
                    <button onclick="removeExpense(${exp.id})" class="text-slate-300 hover:text-rose-500 transition opacity-0 group-hover:opacity-100"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
            </li>`).join('');
    }

    function renderChart(expenses) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        const totals = expenses.reduce((acc, curr) => {
            const key = curr.type === 'cartao' ? `Cartão: ${curr.cardName}` : 'Geral';
            acc[key] = (acc[key] || 0) + curr.value;
            return acc;
        }, {});

        const labels = Object.keys(totals);
        const dataValues = Object.values(totals);
        const colors = labels.map((_, i) => i === 0 ? '#f97316' : (i === 1 ? '#a855f7' : '#3b82f6'));

        if (myChart) myChart.destroy();
        if (labels.length === 0) return;

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels, datasets: [{ data: dataValues, backgroundColor: colors, borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } } } }
        });
    }

    function exportToCSV() {
        let csv = "Mês,Descrição,Valor,Tipo,Cartão,Observação\n";
        Object.keys(state.monthsData).forEach(mKey => {
            state.monthsData[mKey].expenses.forEach(e => {
                csv += `${mKey},${e.description},${e.value.toFixed(2)},${e.type},${e.cardName || '-'},${e.observation || '-'}\n`;
            });
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `financas_completo.csv`;
        link.click();
    }

    function formatCurrency(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
</script>
</body>
</html>
